<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Condejorge Wars — Admin</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  /* Estilos propios de esta pagina; lo compartido con la web publica (mapa a
     pantalla completa, cabecera flotante, panel lateral) vive en shared.css. */
  body { font-family: system-ui, sans-serif; }
  #login, #configForm { max-width: 720px; margin: 60px auto; padding: 20px 24px;
                         background:#101c26; border:1px solid #223140; border-radius:14px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 13px; margin: 0; }
  label { display:block; margin-top: 12px; font-size: 13px; color:#8fd9f5; }
  input, select { width:100%; padding:8px; margin-top:4px; border-radius:6px; border:1px solid #223140; background:#152029; color:#eaf7ff; box-sizing:border-box; }
  .faction-row { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .faction-row input[type=text] { flex:2; }
  .faction-row input[type=color] { flex:0 0 50px; padding:2px; height:36px; }
  button { padding:10px 16px; border-radius:8px; border:none; background:#7fd4f0; color:#04141c; font-weight:600; cursor:pointer; }
  button.secondary { background:#223140; color:#eaf7ff; }
  button.danger { background:#ffb4a2; color:#3a0a0a; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  #status { font-size:13px; color:#7fe0a8; margin-top:10px; }
  .hidden { display:none; }

  /* .factionCards/.factionCard/.rosterMini viven en shared.css — las usan
     tanto este panel como el de la web pública (ver public/factionCards.js). */

  #liveState { margin-top:16px; }
  #liveState summary { cursor:pointer; font-size:12px; color:#8fd9f5; }
  #liveState pre { margin-top:8px; font-size:11px; white-space:pre-wrap; background:#0f1a22; padding:10px; border-radius:8px; max-height:260px; overflow:auto; }

  #botStatusBox { font-size:12px; background:#152029; border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; }
  #botStatusBox .botStateLine { display:flex; align-items:center; gap:6px; font-weight:600; }
  #botStatusBox .botDot { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  #botStatusBox .botDetail { color:#8fd9f5; }
  #botStatusBox .botError { color:#ffb4a2; }

  #chatLogBox { margin-top:8px; display:flex; flex-direction:column; gap:4px; max-height:220px; overflow:auto; }
  #chatLogBox .chatLogEmpty { font-size:12px; opacity:.5; }
  .chatLogRow { font-size:11px; background:#0f1a22; border-left:3px solid #223140; border-radius:5px; padding:4px 6px; }
  .chatLogRow.ok { border-left-color:#7fe0a8; }
  .chatLogRow.rejected { border-left-color:#ffb4a2; }
  .chatLogRow .clUser { font-weight:600; }
  .chatLogRow .clReason { opacity:.7; }
</style>
</head>
<body>
  <div id="login" style="margin-top:120px">
    <h1 style="font-size:20px;margin:0 0 4px">Condejorge Wars — Admin</h1>
    <label>Contraseña de admin</label>
    <input type="password" id="passwordInput" />
    <button onclick="connect()">Entrar</button>
    <div id="status"></div>
  </div>

  <div id="configForm" class="hidden">
    <h1 style="font-size:18px;margin:0 0 4px;opacity:.7">Condejorge Wars — Admin</h1>
    <h2>Fase 0 — Configurar partida</h2>

    <label>Canales de Twitch a escuchar (uno por línea — vale el nombre solo, "condejorge", o el link completo, "https://twitch.tv/condejorge", como prefieras)</label>
    <textarea id="channels" rows="2" style="width:100%;padding:8px;border-radius:6px;background:#152029;color:#eaf7ff;border:1px solid #223140;">condejorge</textarea>

    <label>Tamaño del mapa (nº de casillas)</label>
    <input type="number" id="tileCount" value="18" min="6" />

    <label>Reparto inicial</label>
    <select id="mapMode">
      <option value="neutral">Zonas pequeñas + territorio neutral</option>
      <option value="total">Reparto total (sin territorio neutral)</option>
    </select>

    <label><input type="checkbox" id="alliancesEnabled" style="width:auto" checked /> Alianzas activadas</label>

    <div class="row">
      <div style="flex:1"><label>% expansión</label><input type="number" id="expandPercent" value="25" /></div>
      <div style="flex:1"><label>% alianza</label><input type="number" id="alliancePercent" value="50" /></div>
      <div style="flex:1"><label>% especial</label><input type="number" id="specialPercent" value="75" /></div>
    </div>
    <div class="row">
      <div style="flex:1"><label>Reclutamiento (segundos)</label><input type="number" id="recruitmentSec" value="180" /></div>
      <div style="flex:1"><label>Acción (segundos)</label><input type="number" id="actionSec" value="60" /></div>
    </div>

    <h3>Facciones</h3>
    <div id="factionRows"></div>
    <button class="secondary" onclick="addFactionRow()">+ Añadir facción</button>

    <div>
      <button onclick="createMatch()">Crear partida</button>
      <button id="startBtn" class="hidden" onclick="startMatch()">Iniciar partida</button>
    </div>
  </div>

  <div id="liveControls" class="hidden">
    <div id="mapViewport">
      <canvas id="mapCanvas"></canvas>
      <canvas id="mapMarkers"></canvas>
    </div>

    <div class="mapToolbar">
      <button onclick="mapCtrl.zoom(1.25)" title="Acercar">+</button>
      <button onclick="mapCtrl.zoom(0.8)" title="Alejar">−</button>
      <button onclick="mapCtrl.reset()" title="Centrar">⤾</button>
    </div>

    <div class="overlayTopBar">
      <div>
        <h1>Condejorge Wars <span style="opacity:.5">— Admin</span></h1>
        <span class="phaseTag" id="livephaseTag" style="font-size:12px;color:#8fd9f5">—</span>
        <span id="adminTimer" style="font-size:12px;color:#8fd9f5;font-variant-numeric:tabular-nums;margin-left:8px">--:--</span>
      </div>
      <div class="topRight">
        <div id="liveActionButtons" class="row" style="gap:10px">
          <button class="headerBtn secondary" id="pauseBtn" onclick="send('admin:pause')">Pausar</button>
          <button class="headerBtn secondary" id="resumeBtn" onclick="send('admin:resume')">Reanudar</button>
          <button class="headerBtn secondary" onclick="send('admin:advancePhase')">Pasar ronda</button>
          <button class="headerBtn danger" onclick="send('admin:endMatch')">Terminar partida</button>
        </div>
        <button class="headerBtn danger hidden" id="newMatchBtn" onclick="resetToConfig()">🔄 Nueva partida</button>
        <button class="headerBtn" onclick="togglePanel()">📋 Facciones</button>
      </div>
    </div>

    <div id="adminPanel" class="sidePanel">
      <h2>Facciones</h2>
      <div class="factionCards" id="factionCards"></div>

      <h2 style="margin-top:16px">Bot de Twitch</h2>
      <div id="botStatusBox"></div>
      <div id="chatLogBox"></div>

      <details id="liveState">
        <summary>Ver estado en crudo (JSON, para depurar)</summary>
        <pre id="liveStateJson"></pre>
      </details>
    </div>
  </div>

<script src="/mapRenderer.js"></script>
<script src="/factionCards.js"></script>
<script src="/matchTimer.js"></script>
<script>
  let socket = null;
  const defaultFactions = [
    { name: 'Halcones', color: '#e63946' },
    { name: 'Lobos', color: '#457b9d' },
  ];

  function addFactionRow(name = '', color = '#2a9d8f') {
    const container = document.getElementById('factionRows');
    const row = document.createElement('div');
    row.className = 'faction-row';
    const { escapeHtml } = window.CondejorgeFactionCards;
    row.innerHTML = `
      <input type="text" placeholder="Nombre de la facción" value="${escapeHtml(name)}" class="factionName" />
      <input type="color" value="${escapeHtml(color)}" class="factionColor" />
      <label style="margin:0; display:flex; gap:4px; align-items:center; font-size:12px;">
        <input type="checkbox" class="factionSpecial" style="width:auto" /> especial
      </label>
      <button class="secondary" onclick="this.parentElement.remove()">✕</button>
    `;
    container.appendChild(row);
  }
  defaultFactions.forEach((f) => addFactionRow(f.name, f.color));

  function connect() {
    const token = document.getElementById('passwordInput').value;
    const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
    socket = new WebSocket(`${wsProtocol}://${location.host}/ws?role=admin&token=${encodeURIComponent(token)}`);

    socket.addEventListener('open', () => {
      document.getElementById('status').textContent = 'Conectado.';
      document.getElementById('login').classList.add('hidden');
      document.getElementById('configForm').classList.remove('hidden');
    });
    socket.addEventListener('close', () => {
      document.getElementById('status').textContent = 'Contraseña incorrecta o conexión cerrada.';
    });
    socket.addEventListener('message', (event) => {
      const message = JSON.parse(event.data);
      if (message.type === 'state:admin') { lastState = message.payload; renderState(message.payload); }
      else if (message.type === 'map:layout') mapCtrl.setLayout(message.payload);
    });
  }

  let lastState = null;
  // Misma cuenta atrás que la web pública (public/matchTimer.js) — se
  // actualiza cada 250ms en vez de solo cuando llega un `state:admin` nuevo,
  // porque durante la Fase de Acción puede no llegar ningún mensaje nuevo
  // durante todo el tiempo de espera (nada cambia salvo el reloj). Congela el
  // número mientras `timerPaused` esté activo — ver docs/ACCIONES.md.
  const matchTimer = CondejorgeMatchTimer.createMatchTimerTracker();
  setInterval(() => {
    document.getElementById('adminTimer').textContent = matchTimer.formatRemaining(lastState);
  }, 250);

  function send(type, payload) {
    socket.send(JSON.stringify({ type, payload }));
  }

  function createMatch() {
    const factions = [...document.querySelectorAll('.faction-row')].map((row) => ({
      name: row.querySelector('.factionName').value || 'Sin nombre',
      color: row.querySelector('.factionColor').value,
      specialEnabled: row.querySelector('.factionSpecial').checked,
      specialAbility: 'escudo', // catálogo simple por ahora, elegible más adelante desde el panel
    }));

    send('admin:createMatch', {
      factions,
      channels: document.getElementById('channels').value.split('\n').map((s) => s.trim()).filter(Boolean),
      map: { tileCount: Number(document.getElementById('tileCount').value), mode: document.getElementById('mapMode').value },
      alliancesEnabled: document.getElementById('alliancesEnabled').checked,
      thresholds: {
        expandPercent: Number(document.getElementById('expandPercent').value),
        alliancePercent: Number(document.getElementById('alliancePercent').value),
        specialPercent: Number(document.getElementById('specialPercent').value),
      },
      timers: {
        recruitmentMs: Number(document.getElementById('recruitmentSec').value) * 1000,
        actionMs: Number(document.getElementById('actionSec').value) * 1000,
      },
    });
    document.getElementById('startBtn').classList.remove('hidden');
  }

  function startMatch() {
    send('admin:startMatch');
  }

  const PHASE_LABELS = { config: 'Configuración', recruitment: 'Reclutamiento', action: 'Acción', resolution: 'Combate', summary: 'Resumen', end: 'Fin' };

  // Dibujado del mapa: delegado en public/mapRenderer.js, el mismo modulo que
  // usa la web publica (ver docs/ACCIONES.md seccion 6) — aqui solo se conecta.
  const mapCtrl = CondejorgeMap.createMapController({
    viewportEl: document.getElementById('mapViewport'),
    canvasEl: document.getElementById('mapCanvas'),
    markersEl: document.getElementById('mapMarkers'),
  });

  function togglePanel() {
    document.getElementById('adminPanel').classList.toggle('open');
  }

  /**
   * Al terminar partida el motor se queda en fase "end" pero sigue vivo (no
   * hace falta tocar el servidor): "Crear partida" vuelve a llamar a
   * `engine.createMatch()`, que reemplaza la partida entera por una nueva con
   * los ajustes que se pongan en el formulario. Aqui solo volvemos a mostrar
   * el formulario de configuracion en el cliente. Ver docs/ACCIONES.md.
   */
  function resetToConfig() {
    document.getElementById('liveControls').classList.add('hidden');
    document.getElementById('configForm').classList.remove('hidden');
    document.getElementById('startBtn').classList.add('hidden');
  }

  function renderState(state) {
    if (state.phase && state.phase !== 'config') {
      document.getElementById('configForm').classList.add('hidden');
      document.getElementById('liveControls').classList.remove('hidden');
    }

    if (state.phase) {
      document.getElementById('livephaseTag').textContent = `Fase: ${PHASE_LABELS[state.phase] || state.phase} — ronda ${state.round}`;
    }

    // Al terminar la partida los controles de "en curso" (pausar/pasar ronda/
    // terminar) ya no tienen sentido — se cambian por el boton de reiniciar.
    const isEnded = state.phase === 'end';
    document.getElementById('liveActionButtons').classList.toggle('hidden', isEnded);
    document.getElementById('newMatchBtn').classList.toggle('hidden', !isEnded);

    // "Pausar"/"Reanudar" se deshabilitan segun corresponda — antes, pulsar
    // "Pausar" no daba NINGUNA señal visible de que había funcionado (el
    // timer ya se pausaba bien en el servidor, ver docs/ACCIONES.md sección
    // 6 "Timer de fase (pausa)"), lo que parecía "el botón no hace nada".
    document.getElementById('pauseBtn').disabled = !!state.timerPaused;
    document.getElementById('resumeBtn').disabled = !state.timerPaused;

    mapCtrl.setTiles(state.tiles || [], state.factions || [], state.players || []);
    CondejorgeFactionCards.renderFactionCards(document.getElementById('factionCards'), state);
    renderBotStatus(state.botStatus);
    renderChatLog(state.chatLog);
    document.getElementById('liveStateJson').textContent = JSON.stringify(state, null, 2);
  }

  const BOT_STATE_LABELS = {
    disconnected: 'Desconectado',
    connecting: 'Conectando…',
    connected: 'Conectado a Twitch (uniéndose a canales…)',
    reconnecting: 'Conexión perdida, reintentando…',
    error: 'Error de conexión',
  };
  const BOT_STATE_COLORS = {
    disconnected: '#556270',
    connecting: '#f4c95d',
    connected: '#f4c95d',
    reconnecting: '#ffb4a2',
    error: '#ff5a5a',
  };

  /**
   * Muestra de un vistazo si el bot esta realmente conectado y unido al chat
   * de Twitch — sin esto, un fallo de conexion (canal mal escrito, Node
   * viejo sin WebSocket, red bloqueada) es invisible: el admin solo veria
   * que "!faccion1" no hace nada, sin saber por que. Ver docs/ACCIONES.md.
   */
  function renderBotStatus(botStatus) {
    const box = document.getElementById('botStatusBox');
    if (!botStatus) {
      box.innerHTML = '<span class="botDetail">El bot todavía no se ha conectado (pulsa "Iniciar partida").</span>';
      return;
    }
    const joined = botStatus.joinedChannels || [];
    const configured = botStatus.channels || [];
    const dotColor = BOT_STATE_COLORS[botStatus.state] || '#556270';
    const label = BOT_STATE_LABELS[botStatus.state] || botStatus.state;
    const isFullyJoined = botStatus.state === 'connected' && configured.length > 0 && joined.length === configured.length;

    let html = `<div class="botStateLine"><span class="botDot" style="background:${dotColor}"></span>${isFullyJoined ? 'Unido al chat, escuchando comandos' : label}</div>`;
    html += `<div class="botDetail">Canales configurados: ${configured.length ? configured.join(', ') : '—'}</div>`;
    html += `<div class="botDetail">Unido a: ${joined.length ? joined.join(', ') : 'ninguno todavía'}</div>`;
    if (botStatus.lastMessageAt) {
      html += `<div class="botDetail">Último mensaje de chat visto: ${new Date(botStatus.lastMessageAt).toLocaleTimeString()}</div>`;
    } else {
      html += `<div class="botDetail">Todavía no se ha visto ningún mensaje de chat — si esto no cambia, revisa que el canal esté bien escrito y que estéis escribiendo en ese canal.</div>`;
    }
    if (botStatus.lastError) {
      html += `<div class="botError">⚠ ${botStatus.lastError}</div>`;
    }
    box.innerHTML = html;
  }

  /**
   * Ultimos intentos de comando de chat reconocidos (aceptados o rechazados
   * con motivo) — ver server/gameEngine.js `pushChatLog`. Solo se registran
   * comandos con sintaxis valida (ej. "!faccion1"), no cualquier mensaje.
   */
  function renderChatLog(chatLog) {
    const box = document.getElementById('chatLogBox');
    if (!chatLog || chatLog.length === 0) {
      box.innerHTML = '<div class="chatLogEmpty">Todavía no se ha visto ningún comando de chat reconocido.</div>';
      return;
    }
    const { escapeHtml } = window.CondejorgeFactionCards;
    box.innerHTML = chatLog.map((entry) => {
      const time = new Date(entry.time).toLocaleTimeString();
      return `<div class="chatLogRow ${entry.ok ? 'ok' : 'rejected'}">
        <span class="clUser">${escapeHtml(entry.username)}</span> — "${escapeHtml(entry.text)}" — ${time}
        <div class="clReason">${entry.ok ? '✓' : '✕'} ${escapeHtml(entry.reason)}</div>
      </div>`;
    }).join('');
  }

</script>
</body>
</html>
