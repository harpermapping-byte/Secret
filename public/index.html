<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Condejorge Wars</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: system-ui, sans-serif; background:#0c1720; color:#eaf7ff; }
  header { padding: 12px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1c2b38; }
  h1 { font-size: 18px; margin:0; }
  #phase { color:#8fd9f5; font-size:14px; }
  #timer { font-variant-numeric: tabular-nums; font-size: 20px; }
  #board { display:flex; flex-wrap:wrap; gap:6px; padding:20px; max-width: 900px; margin: 0 auto; }
  .tile { width:56px; height:56px; border-radius:8px; display:flex; align-items:center; justify-content:center;
          font-size:11px; background:#20303c; border: 2px solid #14202a; position:relative; }
  .tile.neutral { background:#3a3a3a; }
  #factions { display:flex; gap:12px; padding: 0 20px 10px; flex-wrap:wrap; }
  .faction-chip { padding:6px 10px; border-radius:20px; font-size:13px; display:flex; gap:6px; align-items:center; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #roster { padding: 14px 20px; }
  #roster h2 { font-size:14px; margin: 0 0 10px; color:#8fd9f5; }
  #rosterColumns { display:flex; gap:14px; flex-wrap:wrap; }
  .roster-column { flex:1; min-width:200px; background:#0f1a22; border-radius:10px; padding:10px 12px; border-top: 4px solid #223140; }
  .roster-column h3 { margin:0 0 8px; font-size:13px; display:flex; justify-content:space-between; }
  .roster-empty { font-size:12px; opacity:.5; font-style: italic; }
  .player { padding:5px 8px; border-radius:6px; background:#152029; font-size:13px; border:1px solid #223140; margin-bottom:6px; }
  .player.dead { opacity:0.35; text-decoration: line-through; }
  #summary { padding: 10px 20px; font-size: 13px; color:#ffd166; min-height: 20px; }
  #winner { text-align:center; font-size: 28px; padding: 40px; }

  .headerBtn { background:#152029; color:#8fd9f5; border:1px solid #223140; border-radius:8px; padding:8px 14px;
               font-size:13px; cursor:pointer; }
  .headerBtn:hover { background:#1c2b38; }

  .modalOverlay { position:fixed; inset:0; background:rgba(4,10,15,.72); display:flex; align-items:center;
                  justify-content:center; z-index:100; padding:20px; }
  .modalOverlay.hidden { display:none; }
  .modalBox { background:#101c26; border:1px solid #223140; border-radius:14px; max-width:560px; width:100%;
              max-height:85vh; overflow-y:auto; padding:20px 22px; }
  .modalBox h2 { margin:0 0 4px; font-size:18px; }
  .modalBox .modalSubtitle { font-size:12px; color:#8fd9f5; margin-bottom:14px; }
  .modalClose { float:right; background:none; border:none; color:#8fd9f5; font-size:20px; cursor:pointer; line-height:1; }
  .summarySection { margin-top:16px; }
  .summarySection h3 { font-size:13px; color:#8fd9f5; margin:0 0 8px; text-transform:uppercase; letter-spacing:.03em; }
  .summaryLine { font-size:13px; padding:6px 10px; background:#152029; border-radius:6px; margin-bottom:6px;
                 border-left:3px solid #223140; }
  .summaryEmpty { font-size:12px; opacity:.5; font-style:italic; }
  .fchip { display:inline-flex; align-items:center; gap:5px; font-weight:600; }
  .fchip .dot { width:9px; height:9px; }

  table.leaderboard { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  table.leaderboard th, table.leaderboard td { padding:7px 8px; text-align:center; border-bottom:1px solid #1c2b38; }
  table.leaderboard th { color:#8fd9f5; font-weight:600; font-size:11px; text-transform:uppercase; }
  table.leaderboard td:first-child, table.leaderboard th:first-child { text-align:left; }
</style>
</head>
<body>
  <header>
    <h1>Condejorge Wars <span style="opacity:.5">(placeholders v1)</span></h1>
    <button class="headerBtn" onclick="openLeaderboard()">🏆 Clasificación</button>
    <div id="phase">conectando...</div>
    <div id="timer">--:--</div>
  </header>

  <div id="factions"></div>
  <div id="roster">
    <h2>Quién se ha unido (por facción)</h2>
    <div id="rosterColumns"></div>
  </div>
  <div id="board"></div>
  <div id="winner"></div>

  <div id="summaryModal" class="modalOverlay hidden">
    <div class="modalBox">
      <button class="modalClose" onclick="closeSummaryModal()">✕</button>
      <h2 id="summaryModalTitle">Resumen de ronda</h2>
      <div class="modalSubtitle">Qué ha pasado en esta ronda, fase por fase</div>
      <div id="summaryModalBody"></div>
    </div>
  </div>

  <div id="leaderboardModal" class="modalOverlay hidden">
    <div class="modalBox">
      <button class="modalClose" onclick="closeLeaderboard()">✕</button>
      <h2>Clasificación de facciones</h2>
      <div class="modalSubtitle">Estado actual de la partida</div>
      <div id="leaderboardBody"></div>
    </div>
  </div>

<script>
  const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
  const socket = new WebSocket(`${wsProtocol}://${location.host}/ws?role=public`);
  let lastState = null;
  let lastPhase = null;
  let summaryClosedByUser = false;

  socket.addEventListener('message', (event) => {
    const message = JSON.parse(event.data);
    if (message.type === 'state:public') render(message.payload);
  });

  /** Unica funcion del proyecto para buscar una facción por número dentro del estado recibido por WS. */
  function factionByNumber(state, number) {
    return (state.factions || []).find((f) => f.number === number);
  }

  function render(state) {
    lastState = state;
    document.getElementById('phase').textContent = state.phase ? `Fase: ${phaseLabel(state.phase)} (ronda ${state.round})` : 'Esperando a que el admin configure la partida...';

    const factionsEl = document.getElementById('factions');
    factionsEl.innerHTML = '';
    (state.factions || []).forEach((f) => {
      const chip = document.createElement('div');
      chip.className = 'faction-chip';
      chip.style.background = '#152029';
      chip.innerHTML = `<span class="dot" style="background:${f.color}"></span> #${f.number} ${f.name} — ${f.territoryCount} terr. — industria ${f.industry.toFixed(1)}`;
      factionsEl.appendChild(chip);
    });

    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    (state.tiles || []).forEach((t) => {
      const div = document.createElement('div');
      div.className = 'tile' + (t.neutral ? ' neutral' : '');
      if (!t.neutral) {
        const faction = factionByNumber(state, t.ownerFactionNumber);
        if (faction) div.style.background = faction.color;
      }
      div.textContent = t.id;
      boardEl.appendChild(div);
    });

    renderRoster(state);
    handleSummaryModal(state);

    document.getElementById('winner').textContent = state.winnerFactionNumber
      ? `¡Gana la facción #${state.winnerFactionNumber}!`
      : '';
  }

  // ---------------------------------------------------------------------
  // Popup de resumen de ronda: se abre solo al entrar en Fase de Resumen,
  // se cierra solo al salir de ella (o si el espectador le da a la X antes).
  // ---------------------------------------------------------------------
  function handleSummaryModal(state) {
    const enteringSummary = state.phase === 'summary' && lastPhase !== 'summary';
    const leavingSummary = state.phase !== 'summary' && lastPhase === 'summary';
    lastPhase = state.phase;

    if (enteringSummary) {
      summaryClosedByUser = false;
      renderSummaryModal(state);
      document.getElementById('summaryModal').classList.remove('hidden');
    } else if (state.phase === 'summary' && !summaryClosedByUser) {
      renderSummaryModal(state); // por si llega un segundo state:public mientras el popup ya esta abierto
    }
    if (leavingSummary) closeSummaryModal();
  }

  function closeSummaryModal() {
    summaryClosedByUser = true;
    document.getElementById('summaryModal').classList.add('hidden');
  }

  function renderSummaryModal(state) {
    document.getElementById('summaryModalTitle').textContent = `Resumen de la ronda ${state.round}`;
    const blocks = state.summaryBlocks || [];
    const byKind = Object.fromEntries(blocks.map((b) => [b.kind, b.data]));
    const body = document.getElementById('summaryModalBody');
    body.innerHTML = [
      summarySection('Conquistas', (byKind.conquests || []).map((c) => conquestLine(state, c))),
      summarySection('Industria', industryLines(state, byKind.industry || [], byKind.industryUnlocks || [])),
      summarySection('Combates', (byKind.combats || []).map((c) => combatLine(state, c))),
      summarySection('Bajas', (byKind.casualties || []).map((c) => casualtyLine(state, c))),
    ].join('');
  }

  function summarySection(title, lines) {
    const body = lines.length
      ? lines.map((line) => `<div class="summaryLine">${line}</div>`).join('')
      : '<div class="summaryEmpty">Sin novedades</div>';
    return `<div class="summarySection"><h3>${title}</h3>${body}</div>`;
  }

  function fchip(state, factionNumber) {
    const f = factionByNumber(state, factionNumber);
    if (!f) return 'territorio neutral';
    return `<span class="fchip"><span class="dot" style="background:${f.color}"></span>${f.name}</span>`;
  }

  function conquestLine(state, c) {
    const origin = c.fromFactionNumber != null ? fchip(state, c.fromFactionNumber) : 'territorio neutral';
    return c.kind === 'expansion'
      ? `${fchip(state, c.toFactionNumber)} se expandió sobre ${origin} (casilla ${c.tileId})`
      : `${fchip(state, c.toFactionNumber)} conquistó la casilla ${c.tileId} a ${origin}`;
  }

  const TIER_LABELS = { tanque: 'Tanque', bombardeo: 'Bombardeo', tanque_x2: 'Tanque x2', operacion_especial: 'Operación especial' };

  function industryLines(state, industryData, unlocksData) {
    const lines = industryData
      .filter((d) => d.gained > 0)
      .map((d) => `${fchip(state, d.faction)} produjo +${d.gained.toFixed(1)} de industria (total ${d.industry.toFixed(1)})`);
    unlocksData.forEach((u) => {
      lines.push(`${fchip(state, u.factionNumber)} desbloqueó la mejora <strong>${TIER_LABELS[u.tierKey] || u.tierKey}</strong>`);
    });
    return lines;
  }

  function combatLine(state, c) {
    const attacker = fchip(state, c.attackerFactionNumber);
    const defender = fchip(state, c.defenderFactionNumber);
    if (c.outcome === 'attacker_won') return `${attacker} atacó a ${defender} y ganó el combate`;
    if (c.outcome === 'defender_held') return `${attacker} atacó a ${defender}, pero la defensa aguantó`;
    return `${attacker} atacó a ${defender} junto a otra facción, pero no fue quien conquistó`;
  }

  function casualtyLine(state, c) {
    return `${c.username} (${fchip(state, c.factionNumber)}) ha caído`;
  }

  // ---------------------------------------------------------------------
  // Popup de clasificación: bajo demanda, con los datos ya presentes en
  // el ultimo estado recibido (no hace falta pedir nada nuevo al servidor).
  // ---------------------------------------------------------------------
  function openLeaderboard() {
    if (!lastState) return;
    renderLeaderboard(lastState);
    document.getElementById('leaderboardModal').classList.remove('hidden');
  }

  function closeLeaderboard() {
    document.getElementById('leaderboardModal').classList.add('hidden');
  }

  function renderLeaderboard(state) {
    const rows = (state.factions || [])
      .map((f) => {
        const players = (state.players || []).filter((p) => p.factionNumber === f.number && p.alive);
        return {
          faction: f,
          soldiers: players.filter((p) => p.unitType === 'soldier').length,
          tanks: players.filter((p) => p.unitType === 'tank').length,
          territories: f.territoryCount,
          wonders: f.wondersCount,
          industryPerRound: f.industryGainedLastRound,
          killsCaused: f.killsCaused,
        };
      })
      .sort((a, b) => b.territories - a.territories || b.faction.industry - a.faction.industry);

    const body = document.getElementById('leaderboardBody');
    body.innerHTML = `
      <table class="leaderboard">
        <thead>
          <tr><th>Facción</th><th>Soldados</th><th>Tanques</th><th>Terr.</th><th>Maravillas</th><th>Ind./ronda</th><th>Bajas causadas</th></tr>
        </thead>
        <tbody>
          ${rows
            .map(
              (r) => `<tr>
                <td>${fchip(state, r.faction.number)}</td>
                <td>${r.soldiers}</td>
                <td>${r.tanks}</td>
                <td>${r.territories}</td>
                <td>${r.wonders}</td>
                <td>${r.industryPerRound.toFixed(1)}</td>
                <td>${r.killsCaused}</td>
              </tr>`
            )
            .join('')}
        </tbody>
      </table>`;
  }

  function renderRoster(state) {
    const columnsEl = document.getElementById('rosterColumns');
    columnsEl.innerHTML = '';
    (state.factions || []).forEach((f) => {
      const playersInFaction = (state.players || []).filter((p) => p.factionNumber === f.number);
      const column = document.createElement('div');
      column.className = 'roster-column';
      column.style.borderTopColor = f.color;
      column.innerHTML = `<h3><span><span class="dot" style="background:${f.color}"></span> ${f.name}</span><span>${playersInFaction.length}</span></h3>`;
      if (playersInFaction.length === 0) {
        column.innerHTML += '<div class="roster-empty">nadie unido todavía</div>';
      } else {
        playersInFaction.forEach((p) => {
          const div = document.createElement('div');
          div.className = 'player' + (p.alive ? '' : ' dead');
          div.textContent = `${p.username}${p.unitType === 'tank' ? ' 🛡' : ''}`;
          column.appendChild(div);
        });
      }
      columnsEl.appendChild(column);
    });
  }

  function phaseLabel(phase) {
    return { config: 'Configuración', recruitment: 'Reclutamiento', action: 'Acción', resolution: 'Combate', summary: 'Resumen', end: 'Fin' }[phase] || phase;
  }

  setInterval(() => {
    if (!lastState || !lastState.timerEndsAt) { document.getElementById('timer').textContent = '--:--'; return; }
    const remainingMs = Math.max(0, lastState.timerEndsAt - Date.now());
    const seconds = Math.ceil(remainingMs / 1000);
    document.getElementById('timer').textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
  }, 250);
</script>
</body>
</html>
